<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCM FAQ Bot</title>
  <style>
    :root{--blue:#0f5cab;--blue2:#eaf3ff;--line:#dce3ec;--text:#172033;--muted:#697386;--bg:#f5f7fa;--white:#fff;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:940px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 30px rgba(30,50,80,.08)}
    header{padding:22px 24px;border-bottom:1px solid var(--line)}header h1{font-size:22px;margin:0 0 6px}header p{color:var(--muted);margin:0;font-size:14px}
    .category-bar{display:flex;gap:8px;overflow:auto;padding:14px 18px;border-bottom:1px solid var(--line)}
    .cat{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}.cat.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    #chat{height:calc(100vh - 272px);min-height:430px;overflow:auto;padding:22px 20px;background:#fbfcfe}
    .row{display:flex;margin:0 0 14px}.row.user{justify-content:flex-end}.bubble{max-width:76%;padding:12px 14px;border-radius:16px;line-height:1.55;font-size:14px;word-break:break-word;box-shadow:0 1px 2px rgba(20,30,50,.05)}
    .user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:5px}.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
    .meta{font-size:12px;color:var(--muted);margin-top:6px}.contact{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
    .suggestions{display:flex;flex-direction:column;gap:7px;margin:4px 0 18px 0}.suggestion{border:1px solid #b9d4f3;background:#fff;color:#164f86;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer}
    .feedback{margin:4px 0 18px 0;padding-left:2px}.feedback-title{font-size:12px;color:var(--muted);margin-bottom:7px}.feedback-actions{display:flex;gap:7px;flex-wrap:wrap}.fb-btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 11px;cursor:pointer}.fb-btn:disabled{opacity:.55;cursor:default}
    .feedback-detail{margin-top:9px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;max-width:570px}.reason-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.reason{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;cursor:pointer}.reason.selected{border-color:var(--blue);background:var(--blue2);color:#064b8f}
    .feedback-detail textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px;resize:vertical}.send-feedback{margin-top:8px;border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.feedback-done{font-size:12px;color:#337454;margin-top:7px}.feedback-error{font-size:12px;color:var(--danger);margin-top:7px}
    .quick{padding:12px 18px;border-top:1px solid var(--line)}.quick-title{font-size:12px;color:var(--muted);margin-bottom:8px}.quick-buttons{display:flex;gap:7px;overflow:auto}.quick button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;white-space:nowrap;cursor:pointer}
    .composer{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid #bfc9d8;border-radius:10px;padding:12px 13px;font-size:14px}.composer button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 18px;font-weight:700;cursor:pointer}
    .status{font-size:12px;color:var(--muted);padding:0 18px 12px}
    @media(max-width:600px){.app{box-shadow:none}.bubble{max-width:88%}#chat{height:calc(100vh - 285px)}header{padding:16px 18px}}
  </style>
</head>
<body>
<div class="app">
  <header><h1>SCM FAQ Bot</h1><p>SCM 업무 질문을 입력하면 등록된 FAQ에서 가장 적합한 답변을 찾아드립니다.</p></header>
  <div id="categories" class="category-bar" aria-label="FAQ 카테고리"></div>
  <main id="chat" aria-live="polite"></main>
  <section class="quick"><div class="quick-title">자주 찾는 질문</div><div id="quickButtons" class="quick-buttons"></div></section>
  <form id="composer" class="composer"><input id="questionInput" autocomplete="off" maxlength="1000" placeholder="질문을 입력하세요"><button type="submit">전송</button></form>
  <div id="status" class="status"></div>
</div>

<script>
window.CHATBOT_CONFIG = Object.assign({
  qaApiBase: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/qa",
  logApiUrl: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/logQuestion",
  feedbackApiUrl: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/feedback/save",
  unresolvedApiUrl: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/unresolved/save",
  contactsApiUrl: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/contacts/getContacts",
  topQuestionsApiUrl: "https://scmchatbot-api-e9bdbzbgeae3ecgj.koreasouth-01.azurewebsites.net/api/getTopQuestions",
  requestTimeoutMs: 30000,
  faqButtonCount: 4,
  pendingRetryIntervalMs: 60000
}, window.CHATBOT_CONFIG || {});
</script>
<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  var chat=document.getElementById("chat"), input=document.getElementById("questionInput"), form=document.getElementById("composer"), cats=document.getElementById("categories"), quick=document.getElementById("quickButtons"), status=document.getElementById("status");
  var selectedCategory="all", contacts=[];
  var cfg=window.CHATBOT_CONFIG;
  var esc=window.ChatbotUtils && ChatbotUtils.escapeHtml;

  if(!window.ChatbotStore||!window.ChatbotUtils){chat.innerHTML='<div class="row bot"><div class="bubble">shared.js를 불러오지 못했습니다.</div></div>';return;}

  function formatAnswer(text){return esc(String(text||"")).replace(/(https?:\/\/[^\s&lt;&gt;&quot;]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,"<br>");}
  function scrollBottom(){chat.scrollTop=chat.scrollHeight;}
  function addMessage(text,who,extra){var row=document.createElement("div");row.className="row "+who;var b=document.createElement("div");b.className="bubble";b.innerHTML=who==="bot"?formatAnswer(text):esc(text);if(extra)b.insertAdjacentHTML("beforeend",extra);row.appendChild(b);chat.appendChild(row);scrollBottom();return row;}

  function findContact(id){if(!id)return null;return contacts.find(function(c){return String(c.id)===String(id);})||null;}
  function contactHtml(id){var c=findContact(id);if(!c)return "";return '<div class="contact"><strong>담당자</strong><br>'+esc(c.name||"")+(c.email?'<br>'+esc(c.email):"")+(c.phone?'<br>'+esc(c.phone):"")+'</div>';}
  async function loadContacts(){try{var r=await ChatbotUtils.fetchWithTimeout(cfg.contactsApiUrl,{method:"GET"},cfg.requestTimeoutMs);if(r.ok){var d=await r.json();contacts=Array.isArray(d)?d:(Array.isArray(d.items)?d.items:[]);}}catch(e){console.warn("담당자 로드 실패",e);}}

  function renderCategories(){var labels=ChatbotStore.getCategoryLabels();cats.innerHTML="";ChatbotStore.getCategories().forEach(function(c){var b=document.createElement("button");b.type="button";b.className="cat"+(selectedCategory===c?" active":"");b.textContent=labels[c]||c;b.addEventListener("click",function(){selectedCategory=c;renderCategories();renderQuick();});cats.appendChild(b);});}
  function renderQuick(){var list=ChatbotStore.getQAByCategory(selectedCategory), tops=list.filter(function(x){return x.top;});var use=(tops.length?tops:list).slice(0,cfg.faqButtonCount||4);quick.innerHTML="";use.forEach(function(item){var b=document.createElement("button");b.type="button";b.textContent=item.question;b.addEventListener("click",function(){handleFaqClick(item);});quick.appendChild(b);});if(!use.length)quick.innerHTML='<span class="meta">등록된 FAQ가 없습니다.</span>';}

  function candidateIds(result){return (result.candidates||[]).map(function(x){return x&&x.item?x.item.__id:"";}).filter(Boolean).slice(0,5);}
  function extractLogId(response){return response && (response.logId || response.id || (response.item&&response.item.id)) || "";}
  async function writeLog(data){try{return await ChatbotStore.logQuestion(data);}catch(e){console.warn("질문 로그 저장 실패",e);return null;}}

  function feedbackWidget(ctx){var box=document.createElement("div");box.className="feedback";box.innerHTML='<div class="feedback-title">이 답변이 도움이 되었나요?</div><div class="feedback-actions"><button type="button" class="fb-btn up">👍 도움됐어요</button><button type="button" class="fb-btn down">👎 도움 안 됐어요</button></div>';
    function lock(){box.querySelectorAll("button").forEach(function(b){b.disabled=true;});}
    box.querySelector(".up").addEventListener("click",async function(){lock();try{await ChatbotStore.saveFeedback({logId:ctx.logId,faqId:ctx.faqId,category:ctx.category,question:ctx.question,rating:"up"});box.innerHTML='<div class="feedback-done">의견 감사합니다. 답변 개선에 활용할게요.</div>';}catch(e){if(e.status===409){box.innerHTML='<div class="feedback-done">이미 평가한 답변입니다.</div>';}else{box.innerHTML+='<div class="feedback-error">평가 전송에 실패했습니다. 자동 재시도됩니다.</div>';}}});
    box.querySelector(".down").addEventListener("click",function(){box.querySelector(".feedback-actions").style.display="none";renderReasons();});
    function renderReasons(){var reasons=[['not_relevant','원하는 답변이 아니에요'],['outdated','정보가 오래됐어요'],['insufficient','설명이 부족해요'],['incorrect','내용이 틀린 것 같아요'],['link_problem','링크/파일 문제가 있어요'],['other','기타']];var d=document.createElement("div");d.className="feedback-detail";d.innerHTML='<div class="feedback-title">어떤 부분이 부족했나요?</div><div class="reason-list"></div><textarea maxlength="300" placeholder="추가 의견이 있다면 적어주세요. (선택)"></textarea><br><button type="button" class="send-feedback">의견 보내기</button><div class="feedback-error" style="display:none"></div>';var selected="",list=d.querySelector(".reason-list");reasons.forEach(function(r){var b=document.createElement("button");b.type="button";b.className="reason";b.textContent=r[1];b.addEventListener("click",function(){selected=r[0];list.querySelectorAll(".reason").forEach(function(x){x.classList.remove("selected");});b.classList.add("selected");});list.appendChild(b);});d.querySelector(".send-feedback").addEventListener("click",async function(){var err=d.querySelector(".feedback-error");if(!selected){err.textContent="사유를 하나 선택해 주세요.";err.style.display="block";return;}d.querySelectorAll("button,textarea").forEach(function(x){x.disabled=true;});try{await ChatbotStore.saveFeedback({logId:ctx.logId,faqId:ctx.faqId,category:ctx.category,question:ctx.question,rating:"down",reasonCode:selected,reasonText:d.querySelector("textarea").value});box.innerHTML='<div class="feedback-done">의견 감사합니다. 답변 개선에 활용할게요.</div>';}catch(e){if(e.status===409)box.innerHTML='<div class="feedback-done">이미 평가한 답변입니다.</div>';else{err.textContent="평가 전송에 실패했습니다. 자동 재시도됩니다.";err.style.display="block";d.querySelectorAll("button,textarea").forEach(function(x){x.disabled=false;});}}});box.appendChild(d);scrollBottom();}
    return box;
  }

  function appendFeedback(afterRow,ctx){if(!ctx.logId||!ctx.faqId)return;var w=feedbackWidget(ctx);afterRow.insertAdjacentElement("afterend",w);scrollBottom();}

  async function answerMatched(text,item,result,source){var row=addMessage(item.answer,"bot",contactHtml(item.contactId));var log=await writeLog({question:text,answer:item.answer,matched:true,category:item.category,matchStatus:"matched",matchedFaqId:item.__id,matchScore:result?result.score:100,answerSource:source||"direct_match",candidateFaqIds:result?candidateIds(result):[item.__id]});var logId=extractLogId(log);ChatbotStore.saveHistory({question:text,answer:item.answer,matched:true,category:item.category,faqId:item.__id,score:result?result.score:100});appendFeedback(row,{logId:logId,faqId:item.__id,category:item.category,question:text});}

  function renderSuggestions(original,result){var wrap=document.createElement("div");wrap.className="suggestions";var title=document.createElement("div");title.className="meta";title.textContent="관련된 질문을 찾았습니다. 원하는 질문을 선택해 주세요.";wrap.appendChild(title);(result.candidates||[]).slice(0,3).forEach(function(c){var b=document.createElement("button");b.type="button";b.className="suggestion";b.textContent=c.item.question+" ("+c.score+"점)";b.addEventListener("click",async function(){wrap.remove();await answerMatched(original,c.item,{score:c.score,candidates:result.candidates},"suggestion_click");});wrap.appendChild(b);});chat.appendChild(wrap);scrollBottom();}

  async function handleQuestion(text){text=String(text||"").trim();if(!text)return;addMessage(text,"user");input.value="";status.textContent="답변을 찾고 있습니다...";var result=ChatbotStore.findAnswerSmart(text,selectedCategory);
    if(result.status==="matched"){await answerMatched(text,result.item,result,"direct_match");status.textContent="";return;}
    if(result.status==="suggest"){var log=await writeLog({question:text,answer:"",matched:false,category:selectedCategory,matchStatus:"suggest",matchScore:result.score,answerSource:"none",candidateFaqIds:candidateIds(result)});ChatbotStore.saveHistory({question:text,answer:"",matched:false,category:selectedCategory,status:"suggest",score:result.score,logId:extractLogId(log)});renderSuggestions(text,result);status.textContent="";return;}
    addMessage("정확한 답변을 찾지 못했습니다. 질문을 조금 더 구체적으로 입력해 주세요. 필요한 경우 담당자에게 문의해 주세요.","bot");var noneLog=await writeLog({question:text,answer:"",matched:false,category:selectedCategory,matchStatus:"none",matchScore:result.score,answerSource:"none",candidateFaqIds:candidateIds(result)});var logId=extractLogId(noneLog);try{await ChatbotStore.saveUnresolved({logId:logId,question:text,category:selectedCategory,score:result.score,candidates:result.candidates});}catch(e){console.warn("미해결 질문 저장 실패",e);}ChatbotStore.saveHistory({question:text,answer:"",matched:false,category:selectedCategory,status:"none",score:result.score,logId:logId});status.textContent="";
  }

  async function handleFaqClick(item){addMessage(item.question,"user");await answerMatched(item.question,item,{score:100,candidates:[{item:item,score:100}]},"faq_button");}
  form.addEventListener("submit",function(e){e.preventDefault();handleQuestion(input.value);});

  async function init(){status.textContent="FAQ 데이터를 불러오는 중...";await ChatbotStore.loadFromServer();await loadContacts();renderCategories();renderQuick();addMessage("안녕하세요. SCM 업무 관련 질문을 입력해 주세요.","bot");status.textContent="";ChatbotStore.retryPendingLogs().catch(function(e){console.warn("Pending 재전송 실패",e);});if(cfg.pendingRetryIntervalMs>0)window.setInterval(function(){ChatbotStore.retryPendingLogs().catch(function(){});},cfg.pendingRetryIntervalMs);input.focus();}
  init();
})();
</script>
</body>
</html>
