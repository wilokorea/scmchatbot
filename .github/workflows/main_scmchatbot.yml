# SCM FAQ Chatbot - Azure Web App Deploy

name: Deploy SCM Chatbot to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: scm-chatbot
          path: .
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: scm-chatbot

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_70D6B22F657241AC92D2448F83E49096 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A13541B2FBC54769809A57BB20A91DCD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_824A36CF3CAA4F389D079B9A463FB3B2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: scmchatbot
          slot-name: Production
          package: .
